# BOREAL_DIALER_XCODEGEN_v1
# The repo had no .xcodeproj at all, so nothing could open it in Xcode and no
# runner could build it. XcodeGen builds the project from this file, which means
# the project is reviewable in git instead of an unmergeable pbxproj blob.
name: BorealDialer
options:
  bundleIdPrefix: financial.boreal
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    from: 6.6.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.0.0

schemes:
  BorealDialer:
    build:
      targets:
        BorealDialer: all
        BorealDialerTests: [test]
    test:
      targets:
        - BorealDialerTests

targets:
  BorealDialer:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - BorealDialerLinux
      - path: UI
      # BOREAL_DIALER_KEYPAD_ICON_PLIST_v22 - the app had no icon because the
      # catalogue was never in the target.
      - path: Assets.xcassets
    info:
      path: Config/Info.plist
      # XcodeGen GENERATES this file from the properties below. A hand-written
      # Config/Info.plist is silently overwritten, which is how the microphone
      # usage string went missing and TCC killed the process on first call.
      properties:
        CFBundleDisplayName: Boreal Dialer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - voip
          - audio
          - remote-notification
        NSMicrophoneUsageDescription: Boreal Dialer needs the microphone to place and receive calls.
        NSContactsUsageDescription: Boreal Dialer matches incoming numbers to your CRM contacts.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        SentryDSN: ""
    entitlements:
      path: Config/BorealDialer.entitlements
    dependencies:
      - package: TwilioVoice
        product: TwilioVoice
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: financial.boreal.dialer
        # BOREAL_DIALER_PRODUCT_NAME_v49
        # PRODUCT_NAME was 'Boreal Dialer', with a space, which diverged from
        # the target name in two places that both only mattered once the test
        # target was actually built:
        #
        #   1. XcodeGen derives the test bundle's TEST_HOST from the APP TARGET
        #      NAME, so it pointed at BorealDialer.app/BorealDialer while the
        #      app was really building to a bundle and executable whose names
        #      contained the 'Boreal Dialer' space.
        #      That is the "Could not find test host for BorealDialerTests"
        #      failure, exit 70.
        #   2. PRODUCT_MODULE_NAME defaults to
        #      $(PRODUCT_NAME:c99extidentifier) = Boreal_Dialer, breaking
        #      `@testable import BorealDialer` - which v45 papered over by
        #      pinning PRODUCT_MODULE_NAME explicitly.
        #
        # PRODUCT_NAME only names the .app bundle and the executable inside it.
        # Nothing a user sees depends on it: the home-screen label comes from
        # CFBundleDisplayName ('Boreal Dialer', set in info.properties above)
        # and the identity comes from PRODUCT_BUNDLE_IDENTIFIER. Dropping the
        # override lets PRODUCT_NAME default to the target name, which makes
        # TEST_HOST correct by construction rather than by a hand-written path
        # containing a space.
        #
        # PRODUCT_MODULE_NAME is now redundant but kept explicit: it is the
        # thing `@testable import` depends on, and it should not silently
        # change if PRODUCT_NAME is ever reintroduced.
        PRODUCT_MODULE_NAME: BorealDialer
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # BOREAL_DIALER_TESTS_v40 - the repo had no test target at all.
  BorealDialerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BorealDialerTests
    dependencies:
      - target: BorealDialer
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
