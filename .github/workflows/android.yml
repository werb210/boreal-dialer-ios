# BOREAL_ANDROID_DIALER_v1 - the Android dialler (android/, a native Gradle project; same tooling as BF-client's Android app).
#
#   verify   every pull request and push to main that touches android/: unit tests, a debug APK (install it on the
#            Android Studio emulator or a phone) and an unsigned release bundle (AAB), both kept as run artifacts.
#   release  Actions > "Android dialler" > Run workflow: the signed release bundle, uploaded to Google Play (internal
#            track by default). Without the signing secrets it builds an unsigned bundle and says so; without the Play
#            secret it keeps the bundle as an artifact. Neither case fails the run.
#
# Secrets (repository settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   upload key
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON                                                             Play upload
#   GOOGLE_SERVICES_JSON (raw or base64)                                                         Firebase: alerts + incoming calls
name: Android dialler

on:
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      play_track:
        description: Google Play track
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      play_status:
        description: 'Release status ("draft" until the app has passed its first Play review)'
        type: choice
        default: draft
        options: [draft, completed]

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Firebase file (placeholder unless GOOGLE_SERVICES_JSON is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: node scripts/google-services.mjs
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Debug APK (emulator and sideloading)
        run: ./gradlew --no-daemon assembleDebug
      - name: Release bundle (AAB, unsigned)
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-dialler-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: android-dialler-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-dialler-test-reports
          path: android/app/build/reports
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v5
      - name: Firebase file
        run: node scripts/google-services.mjs
      - name: Upload key
        id: sign
        run: |
          missing=""
          for v in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Android signing::Missing secrets:${missing/KEYSTORE_BASE64/ANDROID_KEYSTORE_BASE64} - building an unsigned bundle (Google Play will not accept it)."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Release bundle (AAB)
        run: ./gradlew --no-daemon testDebugUnitTest bundleRelease
      - name: Check the signature
        if: steps.sign.outputs.signed == 'true'
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: android-dialler-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Summary
        run: |
          {
            echo "### Android dialler"
            echo "- Version code: $((1000 + GITHUB_RUN_NUMBER))"
            echo "- Signed: ${{ steps.sign.outputs.signed }}"
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    needs: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Google Play credentials
        id: creds
        run: |
          if [ "${{ needs.release.outputs.signed }}" != "true" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Google Play::The bundle is unsigned (no upload key) - not uploaded."
          elif [ -z "$PLAY_JSON" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Google Play::No GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret - not uploaded. The bundle is kept as the run artifact android-dialler-aab."
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.upload == 'true'
        with:
          name: android-dialler-aab
          path: aab
      - name: Upload to Google Play
        if: steps.creds.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.boreal.dialer
          releaseFiles: aab/*.aab
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
