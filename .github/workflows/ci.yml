name: CI
on:
  push:
  pull_request:

jobs:
  dialer-web-build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://server.boreal.financial
    steps:
      - uses: actions/checkout@v5
      - name: Install repo dependencies
        run: npm ci
      - name: Verify dialer-web entrypoint
        run: grep -q '/src/main.ts' packages/dialer-web/index.html
      - name: Ensure dialer-web lockfile is deterministic
        run: |
          npm ci
          git diff --exit-code package-lock.json
          npm --prefix packages/dialer-web ci
          git diff --exit-code packages/dialer-web/package-lock.json
      - name: Clean dialer-web build artifacts
        run: |
          rm -rf packages/dialer-web/node_modules/.vite packages/dialer-web/dist
          npm --prefix packages/dialer-web run clean
      - name: Build dialer-web
        run: npm --prefix packages/dialer-web run build
      - name: Test dialer-web
        run: |
          CI=1 npm --prefix packages/dialer-web run test

  swift-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # BOREAL_DIALER_DUPLICATE_FILENAMES_v2 - fails in seconds on ubuntu rather
      # than partway through a macOS build.
      - name: Check for duplicate Swift filenames
        run: ./scripts/check-duplicate-filenames.sh

      # BOREAL_DIALER_UIKIT_AND_SECTION_v13
      - name: Check UIKit imports
        run: ./scripts/check-uikit-imports.sh

      # BOREAL_DIALER_CATCH_SHADOWING_v19
      - name: Check catch shadowing
        run: ./scripts/check-catch-shadowing.sh

      # BOREAL_DIALER_APPICON_PLACEHOLDER_v25
      - name: Check for empty assets
        run: ./scripts/check-empty-assets.sh

      # BOREAL_DIALER_LAST_DEAD_ROUTES_v43
      - name: Check server paths
        run: ./scripts/check-server-paths.sh

  ios-build:
    needs: swift-lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      # BOREAL_DIALER_BUILD_ERROR_SURFACING_v12
      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project BorealDialer.xcodeproj \
            -scheme BorealDialer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee /tmp/xcodebuild.log

      # BOREAL_DIALER_WATCH_v55 - the watch target is only real if it builds.
      - name: Build watch app
        run: |
          set -o pipefail
          xcodebuild \
            -project BorealDialer.xcodeproj \
            -scheme BorealDialerWatch \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee /tmp/xcodebuild-watch.log

      # BOREAL_DIALER_TEST_DESTINATION_v48
      # v44 used 'platform=iOS Simulator,OS=latest'. OS=latest narrows a set of
      # destinations, it does not pick one, so xcodebuild had no device and
      # exited 70 with "Unable to find a device matching the provided
      # destination specifier" before compiling anything - which is why the test
      # target's sources had still never been built.
      #
      # A pinned model name ('name=iPhone 16') fixes that but breaks the day
      # GitHub rotates that model off the image, which is what v44 was avoiding.
      # A simctl UDID lookup was tried before v44 and exited 66.
      #
      # Instead, ask xcodebuild itself which destinations exist for this scheme
      # and take the newest iPhone simulator among them. That cannot drift from
      # what the runner has, and the raw list is uploaded on failure so a miss
      # is diagnosable instead of being a bare exit code.
      - name: Resolve a simulator destination
        id: sim
        run: |
          set -o pipefail
          xcodebuild \
            -project BorealDialer.xcodeproj \
            -scheme BorealDialer \
            -showdestinations 2>&1 | tee /tmp/destinations.txt
          UDID="$(python3 - <<'PY'
          import re
          import sys

          text = open("/tmp/destinations.txt", encoding="utf-8", errors="replace").read()
          best = None
          for line in text.splitlines():
              if "platform:iOS Simulator" not in line:
                  continue
              # xcodebuild always lists a generic placeholder row with a fake id.
              if "Placeholder" in line:
                  continue
              ident = re.search(r"id:([0-9A-Fa-f-]{8,})", line)
              name = re.search(r"name:([^,}]+)", line)
              if not ident or not name:
                  continue
              if "iPhone" not in name.group(1):
                  continue
              os_match = re.search(r"OS:([0-9.]+)", line)
              version = tuple(int(part) for part in os_match.group(1).split(".")) if os_match else (0,)
              if best is None or version > best[0]:
                  best = (version, ident.group(1), name.group(1).strip())

          if best is None:
              sys.stderr.write("No iPhone simulator destination was offered for this scheme.\n")
              sys.stderr.write(text)
              raise SystemExit(1)

          sys.stderr.write("Selected simulator: %s (iOS %s)\n" % (best[2], ".".join(str(n) for n in best[0])))
          print(best[1])
          PY
          )"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Upload destination list
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-destinations
          path: /tmp/destinations.txt

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project BorealDialer.xcodeproj \
            -scheme BorealDialer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee /tmp/xcodebuild-test.log

      - name: Surface test failures
        if: failure()
        run: |
          echo "## Test failures" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|failed|Failing tests" /tmp/xcodebuild-test.log | head -60 \
            | tee -a "$GITHUB_STEP_SUMMARY" \
            | while IFS= read -r line; do echo "::error::$line"; done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-test-log
          path: /tmp/xcodebuild-test.log

      - name: Surface build errors
        if: failure()
        run: |
          echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|fatal error:" /tmp/xcodebuild.log | head -60 \
            | tee -a "$GITHUB_STEP_SUMMARY" \
            | while IFS= read -r line; do echo "::error::$line"; done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
