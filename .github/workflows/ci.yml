name: CI
on:
  push:
  pull_request:

jobs:
  dialer-web-build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://server.boreal.financial
    steps:
      - uses: actions/checkout@v4
      - name: Install repo dependencies
        run: npm ci
      - name: Verify dialer-web entrypoint
        run: grep -q '/src/main.ts' packages/dialer-web/index.html
      - name: Ensure dialer-web lockfile is deterministic
        run: |
          npm ci
          git diff --exit-code package-lock.json
          npm --prefix packages/dialer-web ci
          git diff --exit-code packages/dialer-web/package-lock.json
      - name: Clean dialer-web build artifacts
        run: |
          rm -rf packages/dialer-web/node_modules/.vite packages/dialer-web/dist
          npm --prefix packages/dialer-web run clean
      - name: Build dialer-web
        run: npm --prefix packages/dialer-web run build
      - name: Test dialer-web
        run: |
          CI=1 npm --prefix packages/dialer-web run test

  swift-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # BOREAL_DIALER_DUPLICATE_FILENAMES_v2 - fails in seconds on ubuntu rather
      # than partway through a macOS build.
      - name: Check for duplicate Swift filenames
        run: ./scripts/check-duplicate-filenames.sh

  ios-build:
    needs: swift-lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      # BOREAL_DIALER_BUILD_ERROR_SURFACING_v12
      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project BorealDialer.xcodeproj \
            -scheme BorealDialer \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee /tmp/xcodebuild.log

      - name: Surface build errors
        if: failure()
        run: |
          echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|fatal error:" /tmp/xcodebuild.log | head -60 \
            | tee -a "$GITHUB_STEP_SUMMARY" \
            | while IFS= read -r line; do echo "::error::$line"; done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
