# BOREAL_DIALER_XCODEGEN_v1
# The repo had no .xcodeproj at all, so nothing could open it in Xcode and no
# runner could build it. XcodeGen builds the project from this file, which means
# the project is reviewable in git instead of an unmergeable pbxproj blob.
name: BorealDialer
options:
  # BOREAL_DIALER_v815_COMPANY_BUNDLE_ID - the dialer ships from the company Apple account (2630108 Alberta Ltd, team
  # 76VAY7UJKJ). financial.boreal.dialer is held by another Apple account, so every target now uses
  # com.borealfinancial.dialer[.*] and the app group group.com.borealfinancial.dialer (all registered Oct 16 2026).
  bundleIdPrefix: com.borealfinancial
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true

# BOREAL_DIALER_BUILD_NUMBER_v789 - one build number for every target. CI sets
# CURRENT_PROJECT_VERSION from GITHUB_RUN_NUMBER on each xcodebuild; each
# target's CFBundleVersion reads it, so the app, the Watch app and every
# extension always carry the same number (App Store Connect rejects a build
# whose embedded bundles disagree). "1" is the local default.
settings:
  base:
    CURRENT_PROJECT_VERSION: "1"

packages:
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    from: 6.6.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.0.0

schemes:
  BorealDialerWatch:
    build:
      targets:
        BorealDialerWatch: all
        BorealDialerWatchTests: [test]
    test:
      targets:
        - BorealDialerWatchTests
  BorealDialer:
    build:
      targets:
        BorealDialer: all
        BorealDialerTests: [test]
    test:
      targets:
        - BorealDialerTests
  BorealDialerCallDirectory:
    build:
      targets:
        BorealDialerCallDirectory: all

targets:
  BorealDialer:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - BorealDialerLinux
      - path: UI
      # BOREAL_DIALER_KEYPAD_ICON_PLIST_v22 - the app had no icon because the
      # catalogue was never in the target.
      - path: Assets.xcassets
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
      # BOREAL_DIALER_v836_SIRI_PHRASES - Siri example phrases (App Store Connect ITMS-90626).
      - path: Config/en.lproj/AppIntentVocabulary.plist
        buildPhase: resources
    info:
      path: Config/Info.plist
      # XcodeGen GENERATES this file from the properties below. A hand-written
      # Config/Info.plist is silently overwritten, which is how the microphone
      # usage string went missing and TCC killed the process on first call.
      properties:
        CFBundleDisplayName: Boreal Dialer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - voip
          - audio
          - remote-notification
        NSMicrophoneUsageDescription: Boreal Dialer needs the microphone to place and receive calls.
        NSUserActivityTypes:
          - INStartCallIntent
          # BOREAL_DIALER_v822_CARPLAY - texts and client messages are communication notifications.
          - INSendMessageIntent
        # BOREAL_DIALER_v822_CARPLAY - Siri messaging is handled in the app (SiriMessageHandler).
        INIntentsSupported:
          - INSendMessageIntent
        NSSiriUsageDescription: Siri reads your Boreal texts aloud in the car and sends your replies from your Boreal line.
        # BOREAL_DIALER_v822_CARPLAY - the car screen. SwiftUI keeps its own iPhone window scene; only the CarPlay
        # role is configured here, and it goes to CarPlaySceneDelegate.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        NSFaceIDUsageDescription: Boreal Dialer uses Face ID to unlock your signed-in session.
        # BOREAL_DIALER_v823 - voice notes after a call, and scanning business cards into new contacts.
        NSSpeechRecognitionUsageDescription: Boreal Dialer turns your spoken notes into text for the client's Boreal timeline.
        NSCameraUsageDescription: Boreal Dialer uses the camera to scan business cards into new contacts.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.borealfinancial.dialer
            CFBundleURLSchemes:
              - borealdialer
        # BOREAL_DIALER_SHARE_TO_BOREAL_v319 - appear in the share sheet for client documents.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Client document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - public.image
              - public.comma-separated-values-text
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.spreadsheetml.sheet
              - com.microsoft.word.doc
              - com.microsoft.excel.xls
              - com.apple.iwork.numbers.sffnumbers
              - com.apple.iwork.numbers.numbers
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        SentryDSN: ""
    entitlements:
      path: Config/BorealDialer.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.borealfinancial.dialer
        # BOREAL_DIALER_v821 - client alerts (missed call, voicemail, texts, client messages, handoffs) are
        # time-sensitive, so a Focus that allows Boreal Dialer lets them through. Needs the Time Sensitive
        # Notifications capability on the com.borealfinancial.dialer App ID.
        com.apple.developer.usernotifications.time-sensitive: true
        # BOREAL_DIALER_v822_CARPLAY - CarPlay Communication App (assigned by Apple Oct 17 2026), Siri messaging, and
        # communication notifications (Siri reads texts aloud). Enable CarPlay Communication, SiriKit and
        # Communication Notifications on the com.borealfinancial.dialer App ID.
        com.apple.developer.carplay-communication: true
        com.apple.developer.siri: true
        com.apple.developer.usernotifications.communication: true
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    dependencies:
      - package: TwilioVoice
        product: TwilioVoice
      - package: Sentry
        product: Sentry
      - target: BorealDialerLiveActivity
      - target: BorealDialerCallDirectory
      - target: BorealDialerNotificationService # BOREAL_DIALER_v822_CARPLAY
      # BOREAL_DIALER_EMBED_WATCH_v375 - the Watch app ships inside the iPhone app.
      # Side-loaded separately, iOS never registered it as this app's companion:
      # WCSession.isWatchAppInstalled read false on a Watch running Boreal, the
      # one-shot link transfer was skipped, and TestFlight/App Store builds would
      # carry no Watch app at all. XcodeGen embeds a watchOS app dependency in
      # the iPhone app's Watch folder ("Embed Watch Content").
      - target: BorealDialerWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borealfinancial.dialer
        # BOREAL_DIALER_PRODUCT_NAME_v49
        # PRODUCT_NAME was 'Boreal Dialer', with a space, which diverged from
        # the target name in two places that both only mattered once the test
        # target was actually built:
        #
        #   1. XcodeGen derives the test bundle's TEST_HOST from the APP TARGET
        #      NAME, so it pointed at BorealDialer.app/BorealDialer while the
        #      app was really building to a bundle and executable whose names
        #      contained the 'Boreal Dialer' space.
        #      That is the "Could not find test host for BorealDialerTests"
        #      failure, exit 70.
        #   2. PRODUCT_MODULE_NAME defaults to
        #      $(PRODUCT_NAME:c99extidentifier) = Boreal_Dialer, breaking
        #      `@testable import BorealDialer` - which v45 papered over by
        #      pinning PRODUCT_MODULE_NAME explicitly.
        #
        # PRODUCT_NAME only names the .app bundle and the executable inside it.
        # Nothing a user sees depends on it: the home-screen label comes from
        # CFBundleDisplayName ('Boreal Dialer', set in info.properties above)
        # and the identity comes from PRODUCT_BUNDLE_IDENTIFIER. Dropping the
        # override lets PRODUCT_NAME default to the target name, which makes
        # TEST_HOST correct by construction rather than by a hand-written path
        # containing a space.
        #
        # PRODUCT_MODULE_NAME is now redundant but kept explicit: it is the
        # thing `@testable import` depends on, and it should not silently
        # change if PRODUCT_NAME is ever reintroduced.
        PRODUCT_MODULE_NAME: BorealDialer
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BorealDialerWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: Tests/BorealDialerWatchTests
    dependencies:
      - target: BorealDialerWatch
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES

  # BOREAL_DIALER_WATCH_v55 - notification surface on the wrist.
  BorealDialerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: Watch
        excludes:
          - PrivacyInfo.xcprivacy
      # BOREAL_DIALER_PRIVACY_MANIFESTS_v789 - each bundle declares its own
      # required-reason API use; App Store Connect checks every one.
      - path: Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The shared vocabulary is compiled into both sides so the two cannot
      # drift; WCSession itself carries untyped dictionaries.
      - path: Sources/WatchShared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Boreal
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # BOREAL_DIALER_v816_WATCH_ICON - App Store Connect refused the upload: the Watch app had no icon
        # (90391 / 90713). Watch/Assets.xcassets/AppIcon (the dialer icon, 1024 single-size) is now in the target.
        CFBundleIconName: AppIcon
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.borealfinancial.dialer
        WKRunsIndependentlyOfCompanionApp: true
        BorealAPIBaseURL: https://server.boreal.financial/api
    dependencies:
      - target: BorealWatchWidget
    entitlements:
      path: Watch/BorealWatch.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.borealfinancial.dialer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borealfinancial.dialer.watchkitapp
        PRODUCT_MODULE_NAME: BorealDialerWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  BorealWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidget
        excludes:
          - PrivacyInfo.xcprivacy
      - path: WatchWidget/PrivacyInfo.xcprivacy # BOREAL_DIALER_PRIVACY_MANIFESTS_v789
        buildPhase: resources
    # INFOPLIST_KEY_NSExtensionPointIdentifier is not a real build setting --
    # Xcode only honours a fixed allowlist of INFOPLIST_KEY_* keys and silently
    # drops the rest. The generated plist had no NSExtension dictionary, so the
    # simulator rejected the .appex at install with "extensionDictionary must be
    # set in placeholder attributes". BorealDialerLiveActivity below is the
    # working pattern: XcodeGen writes the plist from these properties.
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Boreal
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # The provider reads UserDefaults(suiteName:) for its snapshot; without the
    # group entitlement that read returns nil and every complication renders the
    # placeholder. The group already exists -- LiveActivity declares it.
    entitlements:
      path: WatchWidget/BorealWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.borealfinancial.dialer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borealfinancial.dialer.watchkitapp.widget
        PRODUCT_MODULE_NAME: BorealWatchWidget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  # BOREAL_DIALER_TESTS_v40 - the repo had no test target at all.
  BorealDialerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BorealDialerTests
    dependencies:
      - target: BorealDialer
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES

  BorealDialerLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: LiveActivity
        excludes:
          - PrivacyInfo.xcprivacy
      - path: LiveActivity/PrivacyInfo.xcprivacy # BOREAL_DIALER_PRIVACY_MANIFESTS_v789
        buildPhase: resources
      - path: Sources/Shared
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Boreal Call
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LiveActivity/BorealCallLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.borealfinancial.dialer
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borealfinancial.dialer.liveactivity
        GENERATE_INFOPLIST_FILE: NO

  BorealDialerCallDirectory:
    type: app-extension
    platform: iOS
    sources:
      - path: CallDirectory
      - path: Sources/Shared/CallDirectoryStore.swift
    info:
      path: CallDirectory/Info.plist
      properties:
        CFBundleDisplayName: Boreal Caller ID
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryProvider
    entitlements:
      path: CallDirectory/BorealDialerCallDirectory.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.borealfinancial.dialer
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borealfinancial.dialer.calldirectory
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  # BOREAL_DIALER_v822_CARPLAY - turns inbound text / client-message alerts into communication notifications (the
  # sender attached as an INSendMessageIntent) so Siri reads them aloud in CarPlay and on AirPods.
  BorealDialerNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - PrivacyInfo.xcprivacy
      - path: NotificationService/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Shared/CommunicationSender.swift
      - path: Sources/Shared/MissedCallDedupe.swift # BOREAL_DIALER_v832_SIGNOUT_ALERTS
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Boreal Messages
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BorealNotificationService
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.borealfinancial.dialer.notificationservice
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
